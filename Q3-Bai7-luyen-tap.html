<head>
<meta charset="UTF-8">

<title>第七课 · Bài 7 · Luyện tập · 旅行计划 – Guangyu Laoshi</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=LXGW+WenKai+TC&display=swap" rel="stylesheet">
<style>
:root{--plum:#8c2f45;--plum2:#b83a55;--soft:#f6e3e7;--ink:#2f2a2c;--gray:#6b6266;--line:#ecd3d8;--paper:#efeae3;--card:#fffdfb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);background-image:radial-gradient(900px 500px at 100% -5%,#f7e4e8 0%,transparent 60%),radial-gradient(700px 420px at -10% 30%,#e9e4da 0%,transparent 60%);
  font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;font-size:17px}
.home{width:100%;max-width:520px;margin-bottom:12px}
.home a{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);color:var(--plum);font-weight:700;font-size:15px;padding:8px 16px 8px 12px;border-radius:99px;text-decoration:none}
.box{position:relative;width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 30px rgba(90,60,70,.12);padding:28px 24px 24px;text-align:center}
.box::before{content:"";position:absolute;inset:10px;border:1.5px solid #f1dde1;border-radius:16px;pointer-events:none}
.brand{display:flex;align-items:center;justify-content:center;gap:12px}
.brand img{width:62px;height:62px;object-fit:contain}
.brand div{text-align:left;line-height:1.3}
.brand b{display:block;font-size:19px;color:var(--plum)}
.brand span{font-size:13.5px;color:var(--gray)}
.lock{width:70px;height:70px;margin:20px auto 8px;border-radius:20px;background:var(--plum);display:grid;place-items:center;transform:rotate(-5deg);box-shadow:inset 0 0 0 3px rgba(255,255,255,.3)}
.lock svg{width:36px;height:36px;color:#fbeef0}
.k{font-size:15px;font-weight:600;color:var(--gray);margin-top:6px}
h1{font-family:"KaiTi","楷体","STKaiti","Kaiti SC","LXGW WenKai TC",serif;font-weight:700;font-size:36px;line-height:1.25;margin:6px 0 2px;color:var(--plum)}
.sub{font-size:15px;color:var(--gray);margin:0 0 4px}
p{margin:8px 0;color:var(--gray);font-size:16px;line-height:1.5}
.field{margin-top:16px}
input{width:100%;font:inherit;font-size:24px;letter-spacing:.14em;text-align:center;padding:13px 16px;border:2px solid var(--line);border-radius:16px;background:#faf6f4}
input:focus{outline:none;border-color:var(--plum);background:#fff;box-shadow:0 0 0 4px var(--soft)}
button.go{margin-top:14px;border:0;border-radius:99px;font:inherit;font-weight:700;font-size:18px;padding:12px 38px;background:var(--plum);color:#fff;box-shadow:0 8px 20px rgba(140,47,69,.28);cursor:pointer}
button.go:hover{background:var(--plum2)}
button.go[disabled]{opacity:.6}
.msg{min-height:22px;margin-top:12px;font-weight:600;font-size:15px;color:#b3261e}
.zalo{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:#f3e7ea;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;border-radius:99px;padding:6px 14px;font-size:15px}
.who{margin-top:10px;font-size:14px;color:var(--gray)}
.who button{border:0;background:none;color:var(--plum);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.loading{margin-top:18px;font-weight:700;color:var(--plum)}
.noi{margin-top:16px;font-size:12.5px;letter-spacing:.08em;color:#a08f95;text-transform:uppercase}
</style>
</head>

<script>
const UNIT="L7";
const panel=document.getElementById("panel");
const NOT=n=>`Mã của <b>${n}</b> chưa được mở phần này. Liên hệ Thầy Vy để mở thêm.`;
async function openLesson(){
  try{const html=await GY.decrypt(UNIT,document.getElementById("gy-data").textContent.trim());
    document.open();document.write(html);document.close();return true}
  catch(e){if(e.message==="old"){panel.innerHTML='<p class="msg">Trình duyệt quá cũ. Hãy cập nhật iOS / Chrome rồi mở lại.</p>';return true}return false}
}
function form(msg){
  const s=GY.rawSession();
  panel.innerHTML=`<p>Phần này dành cho học viên đã đăng ký. Nhập <b>mã học viên</b> Thầy Vy đã gửi cho bạn.</p>
   <div class="field"><input id="code" placeholder="XXXXXXXX" inputmode="numeric" autocomplete="off" spellcheck="false" value="${s&&s.code?s.code:""}"></div>
   <button class="go" id="go" type="button">Mở bài</button>
   <div class="msg" id="msg">${msg||""}</div>
   <a class="zalo" href="https://zalo.me/${window.GY_ZALO||""}" target="_blank" rel="noopener">💬 Zalo Thầy Vy ${window.GY_ZALO||""}</a>
   ${s&&s.name?`<div class="who">Đang dùng mã của <b>${s.name}</b> · <button type="button" id="out">Đổi mã</button></div>`:""}`;
  const go=document.getElementById("go"),inp=document.getElementById("code");
  const run=async()=>{go.disabled=true;go.textContent="Đang kiểm tra…";const r=await GY.login(inp.value);go.disabled=false;go.textContent="Mở bài";
    if(!r.ok){document.getElementById("msg").textContent=GY.ERR[r.error]||"Có lỗi, thử lại sau.";return}
    if(!GY.key(UNIT)){form(NOT(r.name));return}
    panel.innerHTML='<div class="loading">Đang mở bài…</div>';if(!await openLesson())form("Không mở được bài, thử tải lại trang.")};
  go.addEventListener("click",run);inp.addEventListener("keydown",e=>{if(e.key==="Enter")run()});
  const out=document.getElementById("out");if(out)out.addEventListener("click",()=>{GY.logout();form()});
}
(async()=>{
  let s=GY.session();
  if(s){s=await GY.refresh(false)}
  if(s&&GY.key(UNIT)){if(await openLesson())return}
  const raw=GY.rawSession();
  form(raw&&new Date(raw.exp)<new Date()?GY.ERR.expired:(s&&!GY.key(UNIT)?NOT(s.name):""));
})();
</script>
</body>
</html>
